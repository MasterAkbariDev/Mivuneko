name: Validate Mivuneko
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:e2e
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test -p os-broker -p agent-client -p desktop-core -p gemini-client --locked
      - run: cargo clippy -p os-broker -p agent-client -p desktop-core -p gemini-client --locked -- -D warnings
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: cargo test -p os-broker -p agent-client -p desktop-core -p gemini-client --locked
      - run: npm run tauri -w @mivuneko/desktop -- build --target ${{ matrix.target }} --bundles app
      - run: ditto -c -k --sequesterRsrc --keepParent "target/${{ matrix.target }}/release/bundle/macos/Mivuneko.app" "Mivuneko-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Mivuneko-${{ matrix.target }}
          path: Mivuneko-${{ matrix.target }}.zip
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: cargo test -p os-broker -p agent-client -p desktop-core -p gemini-client --locked
      - run: npm run tauri -w @mivuneko/desktop -- build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: mivuneko-windows-unsigned
          path: target/release/mivuneko-desktop.exe
