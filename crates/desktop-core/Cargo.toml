[package]
name = "desktop-core"
version = "0.1.0"
edition = "2021"
[dependencies]
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json"] }
