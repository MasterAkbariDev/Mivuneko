[package]
name = "mivuneko-desktop"
version = "0.3.2"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
gemini-client = { path = "../../../crates/gemini-client" }
tauri = { version = "2", features = [] }
desktop-core = { path = "../../../crates/desktop-core" }
agent-client = { path = "../../../crates/agent-client" }
os-broker = { path = "../../../crates/os-broker" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
sha2 = "0.10"
tauri-plugin-global-shortcut = "2"
tar = "0.4"
bzip2 = "0.5"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }

[dev-dependencies]
tempfile = "3"
